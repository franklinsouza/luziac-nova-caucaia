<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Novo contato</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Muitos clientes ignoram CSS externo, por isso tudo está inline -->
  </head>
  <body style="margin: 0; padding: 0; background: #f5f7fb">
    <center style="width: 100%; background: #f5f7fb">
      <!-- Wrapper -->
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="100%"
        style="max-width: 620px; margin: 0 auto"
      >
        <tr>
          <td style="padding: 24px 16px">
            <!-- Card -->
            <table
              role="presentation"
              cellpadding="0"
              cellspacing="0"
              border="0"
              width="100%"
              style="
                background: #ffffff;
                border-radius: 10px;
                overflow: hidden;
                border: 1px solid #e6e9ef;
              "
            >
              <tr>
                <td style="padding: 24px 24px 8px 24px; text-align: left">
                  <h1
                    style="
                      margin: 0;
                      font-family: Arial, Helvetica, sans-serif;
                      font-size: 22px;
                      line-height: 28px;
                      color: #111827;
                    "
                  >
                    Contato
                  </h1>
                  <p
                    style="
                      margin: 8px 0 0 0;
                      font-family: Arial, Helvetica, sans-serif;
                      font-size: 14px;
                      line-height: 20px;
                      color: #6b7280;
                    "
                  >
                    Você recebeu um novo contato da LP de Nova Caucaia.<br />
                    Veja os detalhes abaixo:
                  </p>
                </td>
              </tr>

              <!-- Linha de dados -->
              <tr>
                <td style="padding: 8px 24px 0 24px">
                  <table
                    role="presentation"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    width="100%"
                  >
                    <tr>
                      <td
                        style="
                          padding: 12px 0;
                          border-bottom: 1px solid #eef2f7;
                        "
                      >
                        <span
                          style="
                            display: block;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 12px;
                            letter-spacing: 0.3px;
                            color: #6b7280;
                            text-transform: uppercase;
                          "
                          >Nome</span
                        >
                        <strong
                          style="
                            display: block;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 16px;
                            color: #111827;
                          "
                          >{{nome}}</strong
                        >
                      </td>
                    </tr>
                    <tr>
                      <td
                        style="
                          padding: 12px 0;
                          border-bottom: 1px solid #eef2f7;
                        "
                      >
                        <span
                          style="
                            display: block;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 12px;
                            letter-spacing: 0.3px;
                            color: #6b7280;
                            text-transform: uppercase;
                          "
                          >E-mail</span
                        >
                        <a
                          href="mailto:{{email}}"
                          style="
                            display: inline-block;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 16px;
                            color: #2563eb;
                            text-decoration: none;
                          "
                          >{{email}}</a
                        >
                      </td>
                    </tr>
                    <tr>
                      <td
                        style="
                          padding: 12px 0;
                          border-bottom: 1px solid #eef2f7;
                        "
                      >
                        <span
                          style="
                            display: block;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 12px;
                            letter-spacing: 0.3px;
                            color: #6b7280;
                            text-transform: uppercase;
                          "
                          >Whatsapp</span
                        >
                        <a
                          href="tel:{{whatsapp}}"
                          style="
                            display: inline-block;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 16px;
                            color: #111827;
                            text-decoration: none;
                          "
                          >{{whatsapp}}</a
                        >
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            <!-- /Card -->
            <p
              style="
                margin: 12px 0 0 0;
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 11px;
                color: #9ca3af;
              "
            >
              © {{ano}} - SANCAN
            </p>
          </td>
        </tr>
      </table>
      <!-- /Wrapper -->
    </center>
  </body>
</html>
